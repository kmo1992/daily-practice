<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient: warm parchment -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5e6c8"/>
      <stop offset="100%" stop-color="#e8d5a8"/>
    </linearGradient>
    <!-- Sun gradient: golden amber -->
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- Ray gradient -->
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <!-- Horizon gradient -->
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </linearGradient>
    <!-- Checkmark gradient: deep warm green -->
    <linearGradient id="check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Subtle inner border -->
  <rect x="6" y="6" width="500" height="500" rx="90" ry="90" fill="none" stroke="#d4b896" stroke-width="2" opacity="0.5"/>

  <!-- Horizon line -->
  <line x1="80" y1="300" x2="432" y2="300" stroke="#c4a57b" stroke-width="3" stroke-linecap="round"/>

  <!-- Sun rays (behind sun) -->
  <g opacity="0.7">
    <!-- Top ray -->
    <line x1="256" y1="150" x2="256" y2="178" stroke="url(#ray)" stroke-width="10" stroke-linecap="round"/>
    <!-- Top-right ray -->
    <line x1="332" y1="170" x2="316" y2="192" stroke="url(#ray)" stroke-width="10" stroke-linecap="round"/>
    <!-- Right ray -->
    <line x1="362" y1="236" x2="336" y2="244" stroke="url(#ray)" stroke-width="10" stroke-linecap="round"/>
    <!-- Top-left ray -->
    <line x1="180" y1="170" x2="196" y2="192" stroke="url(#ray)" stroke-width="10" stroke-linecap="round"/>
    <!-- Left ray -->
    <line x1="150" y1="236" x2="176" y2="244" stroke="url(#ray)" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Half sun above horizon -->
  <clipPath id="aboveHorizon">
    <rect x="0" y="0" width="512" height="300"/>
  </clipPath>
  <circle cx="256" cy="300" r="64" fill="url(#sun)" clip-path="url(#aboveHorizon)"/>

  <!-- Warm glow around sun -->
  <circle cx="256" cy="300" r="80" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.3" clip-path="url(#aboveHorizon)"/>

  <!-- Checkmark below horizon -->
  <polyline
    points="178,370 228,420 340,308"
    fill="none"
    stroke="url(#check)"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
